name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Web preflight
        run: pnpm -C apps/web run test:preflight

      - name: Deployment config tests
        run: node --test test-node/*.test.cjs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          workspaces: |
            apps/web

      - name: Install trunk and cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,cargo-insta

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Web Rust check
        run: apps/web/scripts/check-rust.sh

      - name: Web production trunk build
        run: env -u NO_COLOR TRUNK_COLOR=never trunk build --release --public-url ./
        working-directory: apps/web

      - name: Web Cucumber BDD (static dist)
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist >/tmp/web-bdd-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request

          url = 'http://127.0.0.1:4174/'
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url) as response:
                      response.read()
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Timed out waiting for static web server')
          PY
          QNI_WEB_EXTERNAL_SERVER=1 QNI_WEB_BASE_URL=http://127.0.0.1:4174 pnpm run test:bdd
        working-directory: apps/web

      - name: Web Playwright legacy
        run: pnpm run test:pw-legacy
        working-directory: apps/web

  qiskit-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend editable install smoke
        run: |
          python3 -m venv /tmp/qni-backend-venv
          /tmp/qni-backend-venv/bin/python -m pip install --upgrade pip
          /tmp/qni-backend-venv/bin/python -m pip install --no-deps -e apps/qiskit-backend

      - name: Backend tests
        run: PYTHONPATH=apps/qiskit-backend/src python3 -m unittest discover apps/qiskit-backend/tests

  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          workspaces: |
            apps/tui
          cache-directories: ~/.cargo/advisory-db

      - name: Install cargo audit/deny/insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-insta

      - name: TUI check
        run: make check
